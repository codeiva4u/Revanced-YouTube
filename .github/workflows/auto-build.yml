name: Auto Build & Release YouTube ReVanced (Non-Root)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'  # Automatically checks for new YouTube & Google Photos patches every 6 hours
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if patch version unchanged'
        required: false
        type: boolean
        default: false
      include_prerelease:
        description: 'Include pre-release patches (dev builds)'
        required: false
        type: boolean
        default: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl wget unzip

      # ──────────────────────────────────────────────────────────
      # Step 1: Fetch latest releases from GitHub API (authenticated)
      # ──────────────────────────────────────────────────────────
      - name: Fetch Latest Releases
        id: fetch-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INCLUDE_PRE="${{ inputs.include_prerelease }}"
          if [ -z "$INCLUDE_PRE" ]; then INCLUDE_PRE="true"; fi

          # Morphe Desktop CLI latest stable
          CLI_RELEASE=$(gh api repos/MorpheApp/morphe-desktop/releases/latest 2>/dev/null || echo '{}')
          CLI_TAG=$(echo "$CLI_RELEASE" | jq -r '.tag_name // "v1.12.0"')
          CLI_URL=$(echo "$CLI_RELEASE" | jq -r '.assets[]? | select(.name | endswith("-all.jar")) | .browser_download_url // ""')
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.12.0/morphe-desktop-1.12.0-all.jar"
            CLI_TAG="v1.12.0"
          fi
          echo "cli_tag=$CLI_TAG" >> $GITHUB_OUTPUT
          echo "cli_url=$CLI_URL" >> $GITHUB_OUTPUT
          echo "Morphe CLI: $CLI_TAG ($CLI_URL)"

          # Anddea Patches (YouTube) - all releases (includes pre-release)
          if [ "$INCLUDE_PRE" = "true" ]; then
            ALL_RELEASES=$(gh api repos/anddea/revanced-patches/releases 2>/dev/null || echo '[]')
            ANDDEA_RELEASE=$(echo "$ALL_RELEASES" | jq 'if type=="array" and length > 0 then .[0] else {} end')
          else
            ANDDEA_RELEASE=$(gh api repos/anddea/revanced-patches/releases/latest 2>/dev/null || echo '{}')
          fi

          ANDDEA_TAG=$(echo "$ANDDEA_RELEASE" | jq -r '.tag_name // ""')
          if [ -z "$ANDDEA_TAG" ] || [ "$ANDDEA_TAG" = "null" ]; then
            ANDDEA_RELEASE=$(gh api repos/anddea/revanced-patches/releases/latest 2>/dev/null || echo '{}')
            ANDDEA_TAG=$(echo "$ANDDEA_RELEASE" | jq -r '.tag_name // "v4.2.0-dev.8"')
          fi

          ANDDEA_PRE=$(echo "$ANDDEA_RELEASE" | jq -r '.prerelease // false')
          ANDDEA_MPP=$(echo "$ANDDEA_RELEASE" | jq -r '.assets[]? | select(.name | endswith(".mpp")) | .browser_download_url // ""')
          if [ -z "$ANDDEA_MPP" ] || [ "$ANDDEA_MPP" = "null" ]; then
            ANDDEA_MPP="https://github.com/anddea/revanced-patches/releases/download/${ANDDEA_TAG}/patches-${ANDDEA_TAG#v}.mpp"
          fi

          ANDDEA_BODY=$(echo "$ANDDEA_RELEASE" | jq -r '.body // "Release notes not available"')

          # De-Vanced Patches (Google Photos)
          DEVANCED_RELEASE=$(gh api repos/RookieEnough/De-Vanced/releases/latest 2>/dev/null || echo '{}')
          DEVANCED_TAG=$(echo "$DEVANCED_RELEASE" | jq -r '.tag_name // "v1.0.4"')
          DEVANCED_MPP=$(echo "$DEVANCED_RELEASE" | jq -r '.assets[]? | select(.name | endswith(".mpp")) | .browser_download_url // ""')
          if [ -z "$DEVANCED_MPP" ] || [ "$DEVANCED_MPP" = "null" ]; then
            DEVANCED_MPP="https://github.com/RookieEnough/De-Vanced/releases/download/${DEVANCED_TAG}/patches-${DEVANCED_TAG#v}.mpp"
          fi

          # Piko Patches (Twitter/X & Instagram)
          PIKO_RELEASE=$(gh api repos/crimera/piko/releases/latest 2>/dev/null || echo '{}')
          PIKO_TAG=$(echo "$PIKO_RELEASE" | jq -r '.tag_name // "v3.8.0"')
          PIKO_MPP=$(echo "$PIKO_RELEASE" | jq -r '.assets[]? | select(.name | endswith(".mpp")) | .browser_download_url // ""')
          if [ -z "$PIKO_MPP" ] || [ "$PIKO_MPP" = "null" ]; then
            PIKO_MPP="https://github.com/crimera/piko/releases/download/${PIKO_TAG}/patches-${PIKO_TAG#v}.mpp"
          fi

          # YouTube version: search all releases for latest "Add support for vX.Y.Z" mention
          ALL_BODIES=$(gh api repos/anddea/revanced-patches/releases 2>/dev/null | jq -r 'if type=="array" then .[].body // "" else "" end' 2>/dev/null || echo "")
          YT_VERSION=$(echo "$ALL_BODIES" | grep -oP '(?<=Add support for `v)\d+\.\d+\.\d+' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$YT_VERSION" ]; then
            YT_VERSION="20.51.39"
          fi

          # Google Photos version: fetch latest version string via custom script
          GPHOTOS_VERSION=$(python scripts/fetch_gphotos.py version 2>/dev/null || echo "7.85.0.952162352")

          # Twitter/X & Instagram versions via custom script
          TWITTER_VERSION=$(python scripts/fetch_social.py twitter_version 2>/dev/null || echo "12.7.1-release.0")
          INSTAGRAM_VERSION=$(python scripts/fetch_social.py instagram_version 2>/dev/null || echo "435.0.0.37.76")

          echo "anddea_tag=$ANDDEA_TAG" >> $GITHUB_OUTPUT
          echo "anddea_prerelease=$ANDDEA_PRE" >> $GITHUB_OUTPUT
          echo "anddea_mpp_url=$ANDDEA_MPP" >> $GITHUB_OUTPUT
          echo "anddea_body<<EOF" >> $GITHUB_OUTPUT
          echo "$ANDDEA_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "yt_version=$YT_VERSION" >> $GITHUB_OUTPUT

          echo "devanced_tag=$DEVANCED_TAG" >> $GITHUB_OUTPUT
          echo "devanced_mpp_url=$DEVANCED_MPP" >> $GITHUB_OUTPUT
          echo "gphotos_version=$GPHOTOS_VERSION" >> $GITHUB_OUTPUT

          echo "piko_tag=$PIKO_TAG" >> $GITHUB_OUTPUT
          echo "piko_mpp_url=$PIKO_MPP" >> $GITHUB_OUTPUT
          echo "twitter_version=$TWITTER_VERSION" >> $GITHUB_OUTPUT
          echo "instagram_version=$INSTAGRAM_VERSION" >> $GITHUB_OUTPUT

          # Official ReVanced GmsCore (Play Protect Verified - No Warnings)
          GMS_RELEASE=$(gh api repos/ReVanced/GmsCore/releases/latest 2>/dev/null || echo '{}')
          GMS_TAG=$(echo "$GMS_RELEASE" | jq -r '.tag_name // "v0.3.13.2.250932"')
          GMS_URL=$(echo "$GMS_RELEASE" | jq -r '.assets[]? | select(.name | endswith("-signed.apk") and (contains("-hw-") | not)) | .browser_download_url // ""')
          if [ -z "$GMS_URL" ] || [ "$GMS_URL" = "null" ]; then
            GMS_URL="https://github.com/ReVanced/GmsCore/releases/download/v0.3.13.2.250932/app.revanced.android.gms-250932004-signed.apk"
            GMS_TAG="v0.3.13.2.250932"
          fi

          echo "gms_tag=$GMS_TAG" >> $GITHUB_OUTPUT
          echo "gms_url=$GMS_URL" >> $GITHUB_OUTPUT

          echo "Anddea Patches (YouTube): $ANDDEA_TAG"
          echo "Target YouTube Version: $YT_VERSION"
          echo "De-Vanced Patches (Google Photos): $DEVANCED_TAG"
          echo "Target Google Photos Version: $GPHOTOS_VERSION"
          echo "Piko Patches (Twitter & Instagram): $PIKO_TAG"
          echo "Target Twitter Version: $TWITTER_VERSION"
          echo "Target Instagram Version: $INSTAGRAM_VERSION"
          echo "ReVanced GmsCore: $GMS_TAG ($GMS_URL)"

          # This repo's latest release tag
          THIS_TAG=$(gh api repos/${{ github.repository }}/releases/latest 2>/dev/null | jq -r '.tag_name // ""' 2>/dev/null || echo "")
          echo "this_repo_tag=$THIS_TAG" >> $GITHUB_OUTPUT
          echo "This Repo Tag: $THIS_TAG"

      # ──────────────────────────────────────────────────────────
      # Step 2: Decide whether a new build is needed
      # ──────────────────────────────────────────────────────────
      - name: Check if Build Required
        id: check-build
        run: |
          FORCE="${{ inputs.force_build }}"
          if [ -z "$FORCE" ]; then FORCE="false"; fi
          LATEST="${{ steps.fetch-releases.outputs.anddea_tag }}"
          CURRENT="${{ steps.fetch-releases.outputs.this_repo_tag }}"

          EVENT="${{ github.event_name }}"
          echo "Trigger event: $EVENT"
          echo "Latest patch : $LATEST"
          echo "Current build: $CURRENT"

          if [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New patch detected or force-build requested. Proceeding."
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date. Skipping build."
          fi

      # ──────────────────────────────────────────────────────────
      # Step 3: Setup Java 21 (required by Morphe CLI & .mpp patches)
      # ──────────────────────────────────────────────────────────
      - name: Setup Java 21
        if: steps.check-build.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ──────────────────────────────────────────────────────────
      # Step 4: Download ReVanced CLI v6, Anddea patches & apkmd
      # ──────────────────────────────────────────────────────────
      - name: Download Build Tools
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          mkdir -p build_tools
          echo "Downloading Morphe CLI ${{ steps.fetch-releases.outputs.cli_tag }}..."
          wget -q -O build_tools/morphe-cli.jar "${{ steps.fetch-releases.outputs.cli_url }}"

          echo "Downloading Anddea YouTube patches ${{ steps.fetch-releases.outputs.anddea_tag }}..."
          wget -q -O build_tools/youtube-patches.mpp "${{ steps.fetch-releases.outputs.anddea_mpp_url }}"

          echo "Downloading De-Vanced Google Photos patches ${{ steps.fetch-releases.outputs.devanced_tag }}..."
          wget -q -O build_tools/gphotos-patches.mpp "${{ steps.fetch-releases.outputs.devanced_mpp_url }}"

          echo "Downloading Piko Twitter/Instagram patches ${{ steps.fetch-releases.outputs.piko_tag }}..."
          wget -q -O build_tools/piko-patches.mpp "${{ steps.fetch-releases.outputs.piko_mpp_url }}"

          echo "Downloading uber-apk-signer..."
          wget -q -O build_tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          echo "Downloading apkmd (APKMirror downloader)..."
          wget -q -O build_tools/apkmd \
            https://github.com/tanishqmanuja/apkmirror-downloader/releases/latest/download/apkmd
          chmod +x build_tools/apkmd

          echo "Downloading ReVanced GmsCore ${{ steps.fetch-releases.outputs.gms_tag }}..."
          wget -q -O "GmsCore-${{ steps.fetch-releases.outputs.gms_tag }}.apk" "${{ steps.fetch-releases.outputs.gms_url }}"

          echo "Tools ready:"
          ls -lh build_tools/
          ls -lh GmsCore-*.apk

      # ──────────────────────────────────────────────────────────
      # Step 5: Download YouTube Stock APK via apkmd
      # universal + nodpi = सबसे compatible variant
      # ──────────────────────────────────────────────────────────
      - name: Download YouTube & Google Photos Stock APKs
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          mkdir -p stock
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          GPHOTOS_VER="${{ steps.fetch-releases.outputs.gphotos_version }}"

          echo "1. Downloading YouTube $YT_VER from APKMirror via apkmd..."
          cat > apkmd-config.json << EOF
          {
            "options": {
              "arch": "universal",
              "dpi": "nodpi",
              "outDir": "stock"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VER}",
                "type": "apk",
                "outFile": "youtube-stock"
              }
            ]
          }
          EOF

          build_tools/apkmd apkmd-config.json

          # Verify YouTube stock APK
          if [ ! -f "stock/youtube-stock.apk" ]; then
            YT_APK=$(find stock -name "*youtube*.apk" -o -name "*YouTube*.apk" | head -1)
            if [ -n "$YT_APK" ]; then
              mv "$YT_APK" stock/youtube-stock.apk
            else
              echo "ERROR: YouTube stock APK missing!"
              exit 1
            fi
          fi

          echo "2. Downloading Google Photos $GPHOTOS_VER stock APK directly from APKMirror..."
          python scripts/fetch_gphotos.py download || true

          if [ ! -f "stock/gphotos-stock.apk" ] || [ $(stat -c%s stock/gphotos-stock.apk 2>/dev/null || echo 0) -lt 10000000 ]; then
            echo "Direct APKMirror download failed, trying archive fallback..."
            curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o stock/gphotos-stock.apk "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos/com.google.android.apps.photos-${GPHOTOS_VER}-arm64-v8a.apk"
          fi

          if [ ! -f "stock/gphotos-stock.apk" ] || [ $(stat -c%s stock/gphotos-stock.apk 2>/dev/null || echo 0) -lt 10000000 ]; then
            echo "Archive mirror failed, downloading stock fallback..."
            curl -s -L -A "Mozilla/5.0" -o stock/gphotos-stock.apk "https://github.com/mentalblank/GPhotos-Revanced/releases/download/39/googlephotos-de-vanced-v7.68.0.884121604-arm64-v8a.apk"
          fi

          if [ ! -f "stock/gphotos-stock.apk" ]; then
            echo "ERROR: Google Photos stock APK missing!"
            exit 1
          fi

          echo "3. Downloading Twitter stock APK..."
          python scripts/fetch_social.py download_twitter || true

          echo "4. Downloading Instagram stock APK..."
          python scripts/fetch_social.py download_instagram || true

          echo "Downloaded stock APKs successfully:"
          ls -lh stock/

      # ──────────────────────────────────────────────────────────
      # Step 6: Patch Non-Root APKs (YouTube & Google Photos)
      # ──────────────────────────────────────────────────────────
      - name: Patch Non-Root APKs
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          ANDDEA_TAG="${{ steps.fetch-releases.outputs.anddea_tag }}"
          GPHOTOS_VER="${{ steps.fetch-releases.outputs.gphotos_version }}"
          DEVANCED_TAG="${{ steps.fetch-releases.outputs.devanced_tag }}"
          TWITTER_VER="${{ steps.fetch-releases.outputs.twitter_version }}"
          INSTAGRAM_VER="${{ steps.fetch-releases.outputs.instagram_version }}"
          PIKO_TAG="${{ steps.fetch-releases.outputs.piko_tag }}"

          YT_OUTPUT="YouTube-ReVanced-NonRoot-${YT_VER}_${ANDDEA_TAG}.apk"
          GP_OUTPUT="GooglePhotos-ReVanced-NonRoot-${GPHOTOS_VER}_${DEVANCED_TAG}.apk"
          TWITTER_OUTPUT="Twitter-ReVanced-NonRoot-${TWITTER_VER}_${PIKO_TAG}.apk"
          INSTAGRAM_OUTPUT="Instagram-ReVanced-NonRoot-${INSTAGRAM_VER}_${PIKO_TAG}.apk"

          rm -f "$YT_OUTPUT" "$GP_OUTPUT" "$TWITTER_OUTPUT" "$INSTAGRAM_OUTPUT"

          # 1. Patch YouTube
          echo "Patching YouTube $YT_VER with Anddea $ANDDEA_TAG ..."
          cat > yt-options.json << EOF
          [
            {
              "patches": {
                "GmsCore support": {
                  "enabled": true,
                  "options": {
                    "gmsCoreVendorGroupId": "app.revanced",
                    "packageNameYouTube": "com.revanced.youtube"
                  }
                },
                "Spoof video streams": {
                  "enabled": true,
                  "options": {
                    "defaultClient": "ANDROID_CREATOR"
                  }
                }
              }
            }
          ]
          EOF

          java -jar build_tools/morphe-cli.jar patch \
            -p build_tools/youtube-patches.mpp \
            -e "GmsCore support" \
            -e "Spoof video streams" \
            --options-file yt-options.json \
            -o "$YT_OUTPUT" \
            stock/youtube-stock.apk

          # 2. Patch Google Photos
          echo "Patching Google Photos $GPHOTOS_VER with De-Vanced $DEVANCED_TAG ..."
          cat > gp-options.json << EOF
          [
            {
              "patches": {
                "GmsCore support": {
                  "enabled": true,
                  "options": {
                    "gmsCoreVendorGroupId": "app.revanced"
                  }
                },
                "Spoof features": {
                  "enabled": true
                },
                "Spoof build info": {
                  "enabled": true
                },
                "Fix selected account persistence": {
                  "enabled": true
                }
              }
            }
          ]
          EOF

          java -jar build_tools/morphe-cli.jar patch \
            -p build_tools/gphotos-patches.mpp \
            -e "GmsCore support" \
            -e "Spoof features" \
            -e "Spoof build info" \
            -e "Fix selected account persistence" \
            --options-file gp-options.json \
            -o "$GP_OUTPUT" \
            stock/gphotos-stock.apk

          # 3. Patch Twitter (X)
          if [ -f "stock/twitter-stock.apk" ]; then
            echo "Patching Twitter (X) $TWITTER_VER with Piko $PIKO_TAG ..."
            java -jar build_tools/morphe-cli.jar patch \
              -p build_tools/piko-patches.mpp \
              -d "Bring back twitter" \
              -d "Change app icon" \
              -d "Show changelogs" \
              --continue-on-error \
              -o "$TWITTER_OUTPUT" \
              stock/twitter-stock.apk || echo "Twitter patch failed or skipped"
          fi

          # 4. Patch Instagram
          if [ -f "stock/instagram-stock.apk" ]; then
            echo "Patching Instagram $INSTAGRAM_VER with Piko $PIKO_TAG ..."
            java -jar build_tools/morphe-cli.jar patch \
              -p build_tools/piko-patches.mpp \
              --continue-on-error \
              -o "$INSTAGRAM_OUTPUT" \
              stock/instagram-stock.apk || echo "Instagram patch failed or skipped"
          fi

          echo "Verifying patched APKs..."
          ls -lh *.apk
          echo "yt_output=$YT_OUTPUT" >> $GITHUB_OUTPUT
          echo "gp_output=$GP_OUTPUT" >> $GITHUB_OUTPUT
          echo "tw_output=$TWITTER_OUTPUT" >> $GITHUB_OUTPUT
          echo "ig_output=$INSTAGRAM_OUTPUT" >> $GITHUB_OUTPUT
        id: patch-apk

      # ──────────────────────────────────────────────────────────
      # Step 7: Finalize & ZipAlign APK
      # Ensure all APKs (YouTube, Google Photos, MicroG-RE) are properly signed and zip-aligned for Android 11+
      # ──────────────────────────────────────────────────────────
      - name: Sign APKs
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          echo "Signing YouTube, Google Photos, Twitter, and Instagram APKs..."
          for apk in YouTube-ReVanced-*.apk GooglePhotos-ReVanced-*.apk Twitter-ReVanced-*.apk Instagram-ReVanced-*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk ..."
              java -jar build_tools/uber-apk-signer.jar \
                --apks "$apk" \
                --allowResign \
                --overwrite
            fi
          done

          # Create fixed-name copies for permanent download links (releases/latest/download/...)
          YT_FILE=$(ls YouTube-ReVanced-NonRoot-*.apk 2>/dev/null | grep -v 'YouTube-ReVanced-NonRoot.apk$' | head -1)
          GP_FILE=$(ls GooglePhotos-ReVanced-NonRoot-*.apk 2>/dev/null | grep -v 'GooglePhotos-ReVanced-NonRoot.apk$' | head -1)
          TW_FILE=$(ls Twitter-ReVanced-NonRoot-*.apk 2>/dev/null | grep -v 'Twitter-ReVanced-NonRoot.apk$' | head -1)
          IG_FILE=$(ls Instagram-ReVanced-NonRoot-*.apk 2>/dev/null | grep -v 'Instagram-ReVanced-NonRoot.apk$' | head -1)
          GMS_FILE=$(ls GmsCore-*.apk 2>/dev/null | grep -v 'GmsCore.apk$' | head -1)

          if [ -n "$YT_FILE" ] && [ -f "$YT_FILE" ]; then cp "$YT_FILE" YouTube-ReVanced-NonRoot.apk; fi
          if [ -n "$GP_FILE" ] && [ -f "$GP_FILE" ]; then cp "$GP_FILE" GooglePhotos-ReVanced-NonRoot.apk; fi
          if [ -n "$TW_FILE" ] && [ -f "$TW_FILE" ]; then cp "$TW_FILE" Twitter-ReVanced-NonRoot.apk; fi
          if [ -n "$IG_FILE" ] && [ -f "$IG_FILE" ]; then cp "$IG_FILE" Instagram-ReVanced-NonRoot.apk; fi
          if [ -n "$GMS_FILE" ] && [ -f "$GMS_FILE" ]; then cp "$GMS_FILE" GmsCore.apk; fi
          
          echo "Patched APKs signed and zipaligned successfully:"
          ls -lh *.apk

      # ──────────────────────────────────────────────────────────
      # Step 8: Create GitHub Release with YouTube & Google Photos APKs
      # ──────────────────────────────────────────────────────────
      - name: Clean Old Release Assets
        if: steps.check-build.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ steps.fetch-releases.outputs.anddea_tag }}"
          echo "Checking for old assets in release $TAG ..."
          OLD_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          for asset in $OLD_ASSETS; do
            if [[ "$asset" == GooglePhotos-ReVanced-NonRoot* ]] || [[ "$asset" == YouTube-ReVanced-NonRoot* ]] || [[ "$asset" == Twitter-ReVanced-NonRoot* ]] || [[ "$asset" == Instagram-ReVanced-NonRoot* ]] || [[ "$asset" == Twitter-Piko-NonRoot* ]] || [[ "$asset" == Instagram-Piko-NonRoot* ]] || [[ "$asset" == GmsCore* ]] || [[ "$asset" == MicroG-RE* ]]; then
              echo "Deleting obsolete asset: $asset"
              gh release delete-asset "$TAG" "$asset" -y 2>/dev/null || true
            fi
          done

      - name: Create GitHub Release
        if: steps.check-build.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.fetch-releases.outputs.anddea_tag }}
          name: "YouTube, Google Photos, Twitter & Instagram ReVanced (${{ steps.fetch-releases.outputs.anddea_tag }})"
          prerelease: false
          make_latest: true
          body: |
            ## Auto Build - Multi App ReVanced (Non-Root)

            ### Packages Included:
            1. **YouTube ReVanced** `${{ steps.fetch-releases.outputs.yt_version }}`
               - Package Name: `com.revanced.youtube`
               - Client Spoofing: `Android Studio`
               - Patches: Anddea `${{ steps.fetch-releases.outputs.anddea_tag }}`

            2. **Google Photos ReVanced** `${{ steps.fetch-releases.outputs.gphotos_version }}`
               - Features: Unlimited Original Quality Storage (Pixel XL Spoofing), Magic Eraser & GmsCore Support
               - Patches: De-Vanced `${{ steps.fetch-releases.outputs.devanced_tag }}`

            3. **Twitter (X) ReVanced** `${{ steps.fetch-releases.outputs.twitter_version }}`
               - Features: Ad-Free Timeline, Clear Tracking Params, Custom Features
               - Patches: Piko `${{ steps.fetch-releases.outputs.piko_tag }}`

            4. **Instagram ReVanced** `${{ steps.fetch-releases.outputs.instagram_version }}`
               - Features: Ad-Free Feed & Stories, Copy Comment, Disable Analytics
               - Patches: Piko `${{ steps.fetch-releases.outputs.piko_tag }}`

            5. **ReVanced GmsCore (Play Protect Verified)** `${{ steps.fetch-releases.outputs.gms_tag }}`
               - Source: [ReVanced/GmsCore](https://github.com/ReVanced/GmsCore)
               - Verified signed APK for Google account login & background sync on Non-Root devices (No Play Protect warnings)

            ### Installation:
            1. Download and install **`GmsCore-*.apk`** first for YouTube and Google Photos login.
            2. Install any of the patched apps: **YouTube ReVanced**, **Google Photos ReVanced**, **Twitter ReVanced**, or **Instagram ReVanced**.
          files: |
            YouTube-ReVanced-NonRoot-*.apk
            YouTube-ReVanced-NonRoot.apk
            GooglePhotos-ReVanced-NonRoot-*.apk
            GooglePhotos-ReVanced-NonRoot.apk
            Twitter-ReVanced-NonRoot-*.apk
            Twitter-ReVanced-NonRoot.apk
            Instagram-ReVanced-NonRoot-*.apk
            Instagram-ReVanced-NonRoot.apk
            GmsCore-*.apk
            GmsCore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # ──────────────────────────────────────────────────────────
      # Step 9: Update update.json and changelog.md
      # ──────────────────────────────────────────────────────────
      - name: Update update.json & changelog.md
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          ANDDEA_TAG="${{ steps.fetch-releases.outputs.anddea_tag }}"
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          ANDDEA_PRE="${{ steps.fetch-releases.outputs.anddea_prerelease }}"
          TODAY=$(date +"%Y-%m-%d")
          VERSION_CODE=$(date +"%Y%m%d")

          # Determine release type
          if [ "$ANDDEA_PRE" = "true" ]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="stable"
          fi

          # Get ZIP URL from latest release assets
          ZIP_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)

          # Update update.json
          jq \
            --arg version "v$YT_VER" \
            --argjson versionCode "$VERSION_CODE" \
            --arg zipUrl "$ZIP_URL" \
            --arg releaseType "$RELEASE_TYPE" \
            '.version = $version | .versionCode = $versionCode | .zipUrl = $zipUrl | .releaseType = $releaseType' \
            update.json > update.json.tmp && mv update.json.tmp update.json

          # Update changelog.md
          rm -f changelog.md
          echo -e "## YouTube ReVanced $YT_VER ($ANDDEA_TAG) ($TODAY)\n\n${{ steps.fetch-releases.outputs.anddea_body }}\n" > changelog.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md
          git commit -m "Auto-update: YouTube $YT_VER with Anddea $ANDDEA_TAG" || echo "No changes to commit"
          git push

      # ──────────────────────────────────────────────────────────
      # Step 10: Auto-Clean Old Workflow Runs
      # Automatically clean up old and obsolete GitHub Action runs
      # ──────────────────────────────────────────────────────────
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 5
