name: Auto Build & Release YouTube ReVanced (Non-Root)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC - checks for new patches
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if patch version unchanged'
        required: false
        type: boolean
        default: false
      include_prerelease:
        description: 'Include pre-release patches (dev builds)'
        required: false
        type: boolean
        default: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl wget unzip

      # ──────────────────────────────────────────────────────────
      # Step 1: Fetch latest releases from GitHub API
      # ──────────────────────────────────────────────────────────
      - name: Fetch Latest Releases
        id: fetch-releases
        run: |
          INCLUDE_PRE="${{ inputs.include_prerelease }}"
          if [ -z "$INCLUDE_PRE" ]; then INCLUDE_PRE="true"; fi

          # ReVanced CLI latest stable (v6.x)
          CLI_RELEASE=$(curl -s https://api.github.com/repos/ReVanced/revanced-cli/releases/latest)
          CLI_TAG=$(echo "$CLI_RELEASE" | jq -r '.tag_name')
          CLI_URL=$(echo "$CLI_RELEASE" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          echo "cli_tag=$CLI_TAG" >> $GITHUB_OUTPUT
          echo "cli_url=$CLI_URL" >> $GITHUB_OUTPUT
          echo "ReVanced CLI: $CLI_TAG"

          # Anddea Patches - all releases (includes pre-release)
          ALL_RELEASES=$(curl -s https://api.github.com/repos/anddea/revanced-patches/releases)
          if [ "$INCLUDE_PRE" = "true" ]; then
            ANDDEA_RELEASE=$(echo "$ALL_RELEASES" | jq '.[0]')
          else
            ANDDEA_RELEASE=$(curl -s https://api.github.com/repos/anddea/revanced-patches/releases/latest)
          fi

          ANDDEA_TAG=$(echo "$ANDDEA_RELEASE" | jq -r '.tag_name')
          ANDDEA_PRE=$(echo "$ANDDEA_RELEASE" | jq -r '.prerelease')
          ANDDEA_MPP=$(echo "$ANDDEA_RELEASE" | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url')
          ANDDEA_BODY=$(echo "$ANDDEA_RELEASE" | jq -r '.body // "No release notes"')

          # YouTube version: search all releases for latest "Add support for vX.Y.Z" mention
          # dev releases often don't mention it, so scan all releases
          ALL_BODIES=$(curl -s https://api.github.com/repos/anddea/revanced-patches/releases | jq -r '.[].body')
          YT_VERSION=$(echo "$ALL_BODIES" | grep -oP '(?<=Add support for `v)\d+\.\d+\.\d+' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$YT_VERSION" ]; then
            YT_VERSION="20.51.39"
          fi

          echo "anddea_tag=$ANDDEA_TAG" >> $GITHUB_OUTPUT
          echo "anddea_prerelease=$ANDDEA_PRE" >> $GITHUB_OUTPUT
          echo "anddea_mpp_url=$ANDDEA_MPP" >> $GITHUB_OUTPUT
          echo "anddea_body<<EOF" >> $GITHUB_OUTPUT
          echo "$ANDDEA_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "yt_version=$YT_VERSION" >> $GITHUB_OUTPUT

          echo "Anddea Patches: $ANDDEA_TAG (pre-release: $ANDDEA_PRE)"
          echo "Target YouTube Version: $YT_VERSION"

          # This repo's latest release tag
          THIS_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // ""')
          echo "this_repo_tag=$THIS_TAG" >> $GITHUB_OUTPUT
          echo "This Repo Tag: $THIS_TAG"

      # ──────────────────────────────────────────────────────────
      # Step 2: Decide whether a new build is needed
      # ──────────────────────────────────────────────────────────
      - name: Check if Build Required
        id: check-build
        run: |
          FORCE="${{ inputs.force_build }}"
          if [ -z "$FORCE" ]; then FORCE="false"; fi
          LATEST="${{ steps.fetch-releases.outputs.anddea_tag }}"
          CURRENT="${{ steps.fetch-releases.outputs.this_repo_tag }}"

          echo "Latest patch : $LATEST"
          echo "Current build: $CURRENT"

          if [ "$FORCE" = "true" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New patch detected or force-build requested. Proceeding."
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date. Skipping build."
          fi

      # ──────────────────────────────────────────────────────────
      # Step 3: Setup Java 17 (required by ReVanced CLI v6)
      # ──────────────────────────────────────────────────────────
      - name: Setup Java 17
        if: steps.check-build.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ──────────────────────────────────────────────────────────
      # Step 4: Download ReVanced CLI, Anddea patches & apkmd tool
      # ──────────────────────────────────────────────────────────
      - name: Download Build Tools
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          mkdir -p build_tools
          echo "Downloading ReVanced CLI ${{ steps.fetch-releases.outputs.cli_tag }}..."
          wget -q -O build_tools/revanced-cli.jar "${{ steps.fetch-releases.outputs.cli_url }}"

          echo "Downloading Anddea patches ${{ steps.fetch-releases.outputs.anddea_tag }}..."
          wget -q -O build_tools/patches.mpp "${{ steps.fetch-releases.outputs.anddea_mpp_url }}"

          echo "Downloading uber-apk-signer..."
          wget -q -O build_tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          echo "Downloading apkmd (APKMirror downloader)..."
          wget -q -O build_tools/apkmd \
            https://github.com/tanishqmanuja/apkmirror-downloader/releases/latest/download/apkmd
          chmod +x build_tools/apkmd

          echo "Tools ready:"
          ls -lh build_tools/

      # ──────────────────────────────────────────────────────────
      # Step 5: Download YouTube Stock APK via apkmd
      # universal + nodpi = सबसे compatible variant
      # ──────────────────────────────────────────────────────────
      - name: Download YouTube Stock APK
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          mkdir -p stock
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          echo "Downloading YouTube $YT_VER from APKMirror via apkmd..."

          # apkmd JSON config - universal arch, nodpi, type apk
          cat > apkmd-config.json << EOF
          {
            "options": {
              "arch": "universal",
              "dpi": "nodpi",
              "outDir": "stock"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VER}",
                "type": "apk",
                "outFile": "youtube-stock"
              }
            ]
          }
          EOF

          cat apkmd-config.json
          build_tools/apkmd apkmd-config.json

          # Verify download
          APK_FILE=$(find stock -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found in stock/"
            ls -lh stock/
            exit 1
          fi

          # Rename to standard name if needed
          [ "$APK_FILE" != "stock/youtube-stock.apk" ] && mv "$APK_FILE" stock/youtube-stock.apk

          FILE_SIZE=$(stat -c%s stock/youtube-stock.apk)
          echo "Downloaded APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "ERROR: APK too small!"
            exit 1
          fi
          echo "YouTube $YT_VER stock APK downloaded successfully!"

      # ──────────────────────────────────────────────────────────
      # Step 6: Patch Non-Root APK using ReVanced CLI v6 + .mpp
      #
      # Note: For Non-Root, we MUST explicitly change the package name
      # using options.json or the --options flag in CLI v6.
      # ──────────────────────────────────────────────────────────
      - name: Patch Non-Root APK
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          ANDDEA_TAG="${{ steps.fetch-releases.outputs.anddea_tag }}"
          OUTPUT_APK="YouTube-ReVanced-NonRoot-${YT_VER}_${ANDDEA_TAG}.apk"

          echo "Patching YouTube $YT_VER with Anddea $ANDDEA_TAG ..."

          # Create options.json to FORCE the package rename and MicroG support
          cat > options.json << EOF
          [
            {
              "patchName": "GmsCore support",
              "options": {
                "Rename package": true,
                "Package name": "app.rvx.android.youtube"
              }
            }
          ]
          EOF

          # Patch command: Enable GmsCore support and pass options
          java -jar build_tools/revanced-cli.jar patch \
            -p build_tools/patches.mpp \
            -b \
            --enable "GmsCore support" \
            --options options.json \
            -o "$OUTPUT_APK" \
            stock/youtube-stock.apk || \
          java -jar build_tools/revanced-cli.jar patch \
            -p build_tools/patches.mpp \
            -b \
            -e "MicroG support" \
            -o "$OUTPUT_APK" \
            stock/youtube-stock.apk

          # Verify output
          if [ ! -f "$OUTPUT_APK" ]; then
            echo "ERROR: Patched APK not created!"
            exit 1
          fi
          PATCHED_SIZE=$(stat -c%s "$OUTPUT_APK")
          echo "Patched APK size: $PATCHED_SIZE bytes"
          echo "output_apk=$OUTPUT_APK" >> $GITHUB_OUTPUT
        id: patch-apk

      # ──────────────────────────────────────────────────────────
      # Step 7: (Optional) Verify Signed APK
      # ReVanced CLI automatically signs and zip-aligns the APK.
      # Double signing with uber-apk-signer causes package invalid error!
      # ──────────────────────────────────────────────────────────
      - name: Verify APK
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          OUTPUT_APK="${{ steps.patch-apk.outputs.output_apk }}"
          echo "APK successfully built and signed by ReVanced CLI!"
          ls -lh *.apk

      # ──────────────────────────────────────────────────────────
      # Step 8: Create GitHub Release with patched APK
      # ──────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.check-build.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.fetch-releases.outputs.anddea_tag }}
          name: "YouTube ReVanced ${{ steps.fetch-releases.outputs.yt_version }} (${{ steps.fetch-releases.outputs.anddea_tag }})"
          prerelease: ${{ steps.fetch-releases.outputs.anddea_prerelease }}
          body: |
            ## Auto Build - YouTube ReVanced Non-Root

            | Component | Version |
            |-----------|---------|
            | **YouTube (Stock)** | `${{ steps.fetch-releases.outputs.yt_version }}` |
            | **ReVanced CLI** | `${{ steps.fetch-releases.outputs.cli_tag }}` |
            | **Anddea Patches** | `${{ steps.fetch-releases.outputs.anddea_tag }}` |
            | **Stock APK Source** | [APKMirror](https://www.apkmirror.com/apk/google-inc/youtube/youtube-${{ steps.fetch-releases.outputs.yt_version }}-release/) |

            ### Installation
            - **Non-Root:** Install [GmsCore/MicroG](https://github.com/Zy0x/YouTube-Revanced#-download-gmscoremicrog) first, then install this APK
            - All patches included

            ### Patch Notes
            ${{ steps.fetch-releases.outputs.anddea_body }}
          files: |
            YouTube-ReVanced-NonRoot-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # ──────────────────────────────────────────────────────────
      # Step 9: Update update.json and changelog.md
      # ──────────────────────────────────────────────────────────
      - name: Update update.json & changelog.md
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          ANDDEA_TAG="${{ steps.fetch-releases.outputs.anddea_tag }}"
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          ANDDEA_PRE="${{ steps.fetch-releases.outputs.anddea_prerelease }}"
          TODAY=$(date +"%Y-%m-%d")
          VERSION_CODE=$(date +"%Y%m%d")

          # Determine release type
          if [ "$ANDDEA_PRE" = "true" ]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="stable"
          fi

          # Get ZIP URL from latest release assets
          ZIP_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)

          # Update update.json
          jq \
            --arg version "v$YT_VER" \
            --argjson versionCode "$VERSION_CODE" \
            --arg zipUrl "$ZIP_URL" \
            --arg releaseType "$RELEASE_TYPE" \
            '.version = $version | .versionCode = $versionCode | .zipUrl = $zipUrl | .releaseType = $releaseType' \
            update.json > update.json.tmp && mv update.json.tmp update.json

          # Update changelog.md
          rm -f changelog.md
          echo -e "## YouTube ReVanced $YT_VER ($ANDDEA_TAG) ($TODAY)\n\n${{ steps.fetch-releases.outputs.anddea_body }}\n" > changelog.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md
          git commit -m "Auto-update: YouTube $YT_VER with Anddea $ANDDEA_TAG" || echo "No changes to commit"
          git push
