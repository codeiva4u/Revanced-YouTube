name: Auto Build & Release YouTube ReVanced (Non-Root)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'  # Automatically checks for new YouTube & Google Photos patches every 6 hours
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if patch version unchanged'
        required: false
        type: boolean
        default: false
      include_prerelease:
        description: 'Include pre-release patches (dev builds)'
        required: false
        type: boolean
        default: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl wget unzip

      # ──────────────────────────────────────────────────────────
      # Step 1: Fetch latest releases from GitHub API (authenticated)
      # ──────────────────────────────────────────────────────────
      - name: Fetch Latest Releases
        id: fetch-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INCLUDE_PRE="${{ inputs.include_prerelease }}"
          if [ -z "$INCLUDE_PRE" ]; then INCLUDE_PRE="true"; fi

          # Morphe Desktop CLI latest stable
          CLI_RELEASE=$(gh api repos/MorpheApp/morphe-desktop/releases/latest 2>/dev/null || echo '{}')
          CLI_TAG=$(echo "$CLI_RELEASE" | jq -r '.tag_name // "v1.12.0"')
          CLI_URL=$(echo "$CLI_RELEASE" | jq -r '.assets[]? | select(.name | endswith("-all.jar")) | .browser_download_url // ""')
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.12.0/morphe-desktop-1.12.0-all.jar"
            CLI_TAG="v1.12.0"
          fi
          echo "cli_tag=$CLI_TAG" >> $GITHUB_OUTPUT
          echo "cli_url=$CLI_URL" >> $GITHUB_OUTPUT
          echo "Morphe CLI: $CLI_TAG ($CLI_URL)"

          # Morphe Official Patches (YouTube)
          MORPHE_RELEASE=$(gh api repos/MorpheApp/morphe-patches/releases/latest 2>/dev/null || echo '{}')
          MORPHE_TAG=$(echo "$MORPHE_RELEASE" | jq -r '.tag_name // "v1.37.0"')
          MORPHE_PRE=$(echo "$MORPHE_RELEASE" | jq -r '.prerelease // false')
          MORPHE_MPP=$(echo "$MORPHE_RELEASE" | jq -r '.assets[]? | select(.name | endswith(".mpp")) | .browser_download_url // ""')
          if [ -z "$MORPHE_MPP" ] || [ "$MORPHE_MPP" = "null" ]; then
            MORPHE_MPP="https://github.com/MorpheApp/morphe-patches/releases/download/${MORPHE_TAG}/patches-${MORPHE_TAG#v}.mpp"
          fi
          MORPHE_BODY=$(echo "$MORPHE_RELEASE" | jq -r '.body // "Release notes not available"')

          # De-Vanced Patches (Google Photos)
          DEVANCED_RELEASE=$(gh api repos/RookieEnough/De-Vanced/releases/latest 2>/dev/null || echo '{}')
          DEVANCED_TAG=$(echo "$DEVANCED_RELEASE" | jq -r '.tag_name // "v1.0.4"')
          DEVANCED_MPP=$(echo "$DEVANCED_RELEASE" | jq -r '.assets[]? | select(.name | endswith(".mpp")) | .browser_download_url // ""')
          if [ -z "$DEVANCED_MPP" ] || [ "$DEVANCED_MPP" = "null" ]; then
            DEVANCED_MPP="https://github.com/RookieEnough/De-Vanced/releases/download/${DEVANCED_TAG}/patches-${DEVANCED_TAG#v}.mpp"
          fi

          # YouTube version: fetch latest supported version from Morphe release notes
          ALL_BODIES=$(gh api repos/MorpheApp/morphe-patches/releases 2>/dev/null | jq -r 'if type=="array" then .[].body // "" else "" end' 2>/dev/null || echo "")
          YT_VERSION=$(echo "$ALL_BODIES" | grep -oP '20\.\d+\.\d+' | head -1)
          if [ -z "$YT_VERSION" ]; then
            YT_VERSION="20.51.39"
          fi

          # Google Photos version
          GPHOTOS_VERSION="7.68.0.884121604"

          echo "morphe_tag=$MORPHE_TAG" >> $GITHUB_OUTPUT
          echo "morphe_prerelease=$MORPHE_PRE" >> $GITHUB_OUTPUT
          echo "morphe_mpp_url=$MORPHE_MPP" >> $GITHUB_OUTPUT
          echo "morphe_body<<EOF" >> $GITHUB_OUTPUT
          echo "$MORPHE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "yt_version=$YT_VERSION" >> $GITHUB_OUTPUT

          echo "devanced_tag=$DEVANCED_TAG" >> $GITHUB_OUTPUT
          echo "devanced_mpp_url=$DEVANCED_MPP" >> $GITHUB_OUTPUT
          echo "gphotos_version=$GPHOTOS_VERSION" >> $GITHUB_OUTPUT

          # Official ReVanced GmsCore (Play Protect Verified - No Warnings)
          GMS_RELEASE=$(gh api repos/ReVanced/GmsCore/releases/latest 2>/dev/null || echo '{}')
          GMS_TAG=$(echo "$GMS_RELEASE" | jq -r '.tag_name // "v0.3.13.2.250932"')
          GMS_URL=$(echo "$GMS_RELEASE" | jq -r '.assets[]? | select(.name | endswith("-signed.apk") and (contains("-hw-") | not)) | .browser_download_url // ""')
          if [ -z "$GMS_URL" ] || [ "$GMS_URL" = "null" ]; then
            GMS_URL="https://github.com/ReVanced/GmsCore/releases/download/v0.3.13.2.250932/app.revanced.android.gms-250932004-signed.apk"
            GMS_TAG="v0.3.13.2.250932"
          fi

          echo "gms_tag=$GMS_TAG" >> $GITHUB_OUTPUT
          echo "gms_url=$GMS_URL" >> $GITHUB_OUTPUT

          echo "Morphe Patches (YouTube): $MORPHE_TAG"
          echo "Target YouTube Version: $YT_VERSION"
          echo "De-Vanced Patches (Google Photos): $DEVANCED_TAG"
          echo "Target Google Photos Version: $GPHOTOS_VERSION"
          echo "ReVanced GmsCore: $GMS_TAG ($GMS_URL)"

          # This repo's latest release tag
          THIS_TAG=$(gh api repos/${{ github.repository }}/releases/latest 2>/dev/null | jq -r '.tag_name // ""' 2>/dev/null || echo "")
          echo "this_repo_tag=$THIS_TAG" >> $GITHUB_OUTPUT
          echo "This Repo Tag: $THIS_TAG"

      # ──────────────────────────────────────────────────────────
      # Step 2: Decide whether a new build is needed
      # Checks updates for BOTH YouTube (Morphe) and Google Photos (De-Vanced)
      # ──────────────────────────────────────────────────────────
      - name: Check if Build Required
        id: check-build
        run: |
          FORCE="${{ inputs.force_build }}"
          if [ -z "$FORCE" ]; then FORCE="false"; fi
          MORPHE="${{ steps.fetch-releases.outputs.morphe_tag }}"
          DEVANCED="${{ steps.fetch-releases.outputs.devanced_tag }}"
          COMBINED_TAG="${MORPHE}_${DEVANCED}"
          CURRENT="${{ steps.fetch-releases.outputs.this_repo_tag }}"

          EVENT="${{ github.event_name }}"
          echo "Trigger event    : $EVENT"
          echo "Latest YT Patch  : $MORPHE"
          echo "Latest GP Patch  : $DEVANCED"
          echo "Combined Target  : $COMBINED_TAG"
          echo "Current Repo Build: $CURRENT"

          if [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$COMBINED_TAG" != "$CURRENT" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New patch update detected (YT or GPhotos) or force-build requested. Proceeding with build."
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "All patches are already up-to-date. Skipping build."
          fi

      # ──────────────────────────────────────────────────────────
      # Step 3: Setup Java 21 (required by Morphe CLI & .mpp patches)
      # ──────────────────────────────────────────────────────────
      - name: Setup Java 21
        if: steps.check-build.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ──────────────────────────────────────────────────────────
      # Step 4: Download ReVanced CLI v6, Morphe patches & apkmd
      # ──────────────────────────────────────────────────────────
      - name: Download Build Tools
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          mkdir -p build_tools
          echo "Downloading Morphe CLI ${{ steps.fetch-releases.outputs.cli_tag }}..."
          wget -q -O build_tools/morphe-cli.jar "${{ steps.fetch-releases.outputs.cli_url }}"

          echo "Downloading Morphe official YouTube patches ${{ steps.fetch-releases.outputs.morphe_tag }}..."
          wget -q -O build_tools/youtube-patches.mpp "${{ steps.fetch-releases.outputs.morphe_mpp_url }}"

          echo "Downloading De-Vanced Google Photos patches ${{ steps.fetch-releases.outputs.devanced_tag }}..."
          wget -q -O build_tools/gphotos-patches.mpp "${{ steps.fetch-releases.outputs.devanced_mpp_url }}"

          echo "Downloading uber-apk-signer..."
          wget -q -O build_tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          echo "Downloading apkmd (APKMirror downloader)..."
          wget -q -O build_tools/apkmd \
            https://github.com/tanishqmanuja/apkmirror-downloader/releases/latest/download/apkmd
          chmod +x build_tools/apkmd

          echo "Downloading ReVanced GmsCore ${{ steps.fetch-releases.outputs.gms_tag }}..."
          wget -q -O "GmsCore-${{ steps.fetch-releases.outputs.gms_tag }}.apk" "${{ steps.fetch-releases.outputs.gms_url }}"

          echo "Tools ready:"
          ls -lh build_tools/
          ls -lh GmsCore-*.apk

      # ──────────────────────────────────────────────────────────
      # Step 5: Download YouTube Stock APK via apkmd
      # universal + nodpi = सबसे compatible variant
      # ──────────────────────────────────────────────────────────
      - name: Download YouTube & Google Photos Stock APKs
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          mkdir -p stock
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          GPHOTOS_VER="${{ steps.fetch-releases.outputs.gphotos_version }}"

          echo "1. Downloading YouTube $YT_VER from APKMirror via apkmd..."
          cat > apkmd-config.json << EOF
          {
            "options": {
              "arch": "universal",
              "dpi": "nodpi",
              "outDir": "stock"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VER}",
                "type": "apk",
                "outFile": "youtube-stock"
              }
            ]
          }
          EOF

          build_tools/apkmd apkmd-config.json

          # Verify YouTube stock APK
          if [ ! -f "stock/youtube-stock.apk" ]; then
            YT_APK=$(find stock -name "*youtube*.apk" -o -name "*YouTube*.apk" | head -1)
            if [ -n "$YT_APK" ]; then
              mv "$YT_APK" stock/youtube-stock.apk
            else
              echo "ERROR: YouTube stock APK missing!"
              exit 1
            fi
          fi

          echo "2. Downloading Google Photos $GPHOTOS_VER stock APK..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o stock/gphotos-stock.apk "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos/com.google.android.apps.photos-${GPHOTOS_VER}-arm64-v8a.apk"

          if [ ! -f "stock/gphotos-stock.apk" ] || [ $(stat -c%s stock/gphotos-stock.apk 2>/dev/null || echo 0) -lt 10000000 ]; then
            echo "Primary mirror failed, trying secondary mirror..."
            curl -s -L -A "Mozilla/5.0" -o stock/gphotos-stock.apk "https://github.com/mentalblank/GPhotos-Revanced/releases/download/39/googlephotos-de-vanced-v7.68.0.884121604-arm64-v8a.apk"
          fi

          if [ ! -f "stock/gphotos-stock.apk" ]; then
            echo "ERROR: Google Photos stock APK missing!"
            exit 1
          fi

          echo "Downloaded stock APKs successfully:"
          ls -lh stock/

      # ──────────────────────────────────────────────────────────
      # Step 6: Patch Non-Root APKs (YouTube & Google Photos)
      # ──────────────────────────────────────────────────────────
      - name: Patch Non-Root APKs
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          MORPHE_TAG="${{ steps.fetch-releases.outputs.morphe_tag }}"
          GPHOTOS_VER="${{ steps.fetch-releases.outputs.gphotos_version }}"
          DEVANCED_TAG="${{ steps.fetch-releases.outputs.devanced_tag }}"

          YT_OUTPUT="YouTube-ReVanced-NonRoot-${YT_VER}_${MORPHE_TAG}.apk"
          GP_OUTPUT="GooglePhotos-ReVanced-NonRoot-${GPHOTOS_VER}_${DEVANCED_TAG}.apk"

          rm -f "$YT_OUTPUT" "$GP_OUTPUT"

          # 1. Patch YouTube
          echo "Patching YouTube $YT_VER with Morphe Official $MORPHE_TAG ..."
          cat > yt-options.json << EOF
          [
            {
              "patches": {
                "GmsCore support": {
                  "enabled": true,
                  "options": {
                    "gmsCoreVendorGroupId": "app.revanced",
                    "packageNameYouTube": "com.revanced.youtube"
                  }
                },
                "Spoof video streams": {
                  "enabled": true
                }
              }
            }
          ]
          EOF

          java -jar build_tools/morphe-cli.jar patch \
            -p build_tools/youtube-patches.mpp \
            -e "GmsCore support" \
            -e "Spoof video streams" \
            --options-file yt-options.json \
            -o "$YT_OUTPUT" \
            stock/youtube-stock.apk

          # 2. Patch Google Photos
          echo "Patching Google Photos $GPHOTOS_VER with De-Vanced $DEVANCED_TAG ..."
          cat > gp-options.json << EOF
          [
            {
              "patches": {
                "GmsCore support": {
                  "enabled": true,
                  "options": {
                    "gmsCoreVendorGroupId": "app.revanced"
                  }
                },
                "Spoof features": {
                  "enabled": true
                },
                "Spoof build info": {
                  "enabled": true
                }
              }
            }
          ]
          EOF

          java -jar build_tools/morphe-cli.jar patch \
            -p build_tools/gphotos-patches.mpp \
            -e "GmsCore support" \
            -e "Spoof features" \
            -e "Spoof build info" \
            --options-file gp-options.json \
            -o "$GP_OUTPUT" \
            stock/gphotos-stock.apk

          echo "Verifying patched APKs..."
          ls -lh *.apk
          echo "yt_output=$YT_OUTPUT" >> $GITHUB_OUTPUT
          echo "gp_output=$GP_OUTPUT" >> $GITHUB_OUTPUT
        id: patch-apk

      # ──────────────────────────────────────────────────────────
      # Step 7: Finalize & ZipAlign APK
      # Ensure all APKs (YouTube, Google Photos, MicroG-RE) are properly signed and zip-aligned for Android 11+
      # ──────────────────────────────────────────────────────────
      - name: Sign APKs
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          echo "Signing YouTube and Google Photos APKs..."
          for apk in YouTube-ReVanced-*.apk GooglePhotos-ReVanced-*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk ..."
              java -jar build_tools/uber-apk-signer.jar \
                --apks "$apk" \
                --allowResign \
                --overwrite
            fi
          done
          
          echo "Patched APKs signed and zip-aligned successfully!"
          ls -lh *.apk

      # ──────────────────────────────────────────────────────────
      # Step 8: Create GitHub Release with YouTube & Google Photos APKs
      # ──────────────────────────────────────────────────────────
      - name: Clean Old Release Assets
        if: steps.check-build.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ steps.fetch-releases.outputs.morphe_tag }}"
          echo "Checking for old assets in release $TAG ..."
          OLD_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          for asset in $OLD_ASSETS; do
            if [[ "$asset" == GooglePhotos-ReVanced-NonRoot* ]] || [[ "$asset" == YouTube-ReVanced-NonRoot* ]] || [[ "$asset" == GmsCore* ]] || [[ "$asset" == MicroG-RE* ]]; then
              echo "Deleting obsolete asset: $asset"
              gh release delete-asset "$TAG" "$asset" -y 2>/dev/null || true
            fi
          done

      - name: Create GitHub Release
        if: steps.check-build.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.fetch-releases.outputs.morphe_tag }}
          name: "YouTube & Google Photos ReVanced (${{ steps.fetch-releases.outputs.morphe_tag }})"
          prerelease: ${{ steps.fetch-releases.outputs.morphe_prerelease }}
          body: |
            ## Auto Build - YouTube & Google Photos ReVanced (Non-Root)

            ### Packages Included:
            1. **YouTube ReVanced** `${{ steps.fetch-releases.outputs.yt_version }}`
               - Package Name: `com.revanced.youtube`
               - Patches: Morphe Official `${{ steps.fetch-releases.outputs.morphe_tag }}`

            2. **Google Photos ReVanced** `${{ steps.fetch-releases.outputs.gphotos_version }}`
               - Features: Unlimited Original Quality Storage (Pixel XL Spoofing), Magic Eraser & GmsCore Support
               - Patches: De-Vanced `${{ steps.fetch-releases.outputs.devanced_tag }}`

            3. **ReVanced GmsCore (Play Protect Verified)** `${{ steps.fetch-releases.outputs.gms_tag }}`
               - Source: [ReVanced/GmsCore](https://github.com/ReVanced/GmsCore)
               - Verified signed APK for Google account login & background sync on Non-Root devices (No Play Protect warnings)

            ### Installation:
            1. Download and install **`GmsCore-*.apk`** first.
            2. Install **YouTube ReVanced** and/or **Google Photos ReVanced**.
          files: |
            YouTube-ReVanced-NonRoot-*.apk
            GooglePhotos-ReVanced-NonRoot-*.apk
            GmsCore-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # ──────────────────────────────────────────────────────────
      # Step 9: Update update.json and changelog.md
      # ──────────────────────────────────────────────────────────
      - name: Update update.json & changelog.md
        if: steps.check-build.outputs.should_build == 'true'
        run: |
          MORPHE_TAG="${{ steps.fetch-releases.outputs.morphe_tag }}"
          YT_VER="${{ steps.fetch-releases.outputs.yt_version }}"
          MORPHE_PRE="${{ steps.fetch-releases.outputs.morphe_prerelease }}"
          TODAY=$(date +"%Y-%m-%d")
          VERSION_CODE=$(date +"%Y%m%d")

          # Determine release type
          if [ "$MORPHE_PRE" = "true" ]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="stable"
          fi

          # Get ZIP URL from latest release assets
          ZIP_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)

          # Update update.json
          jq \
            --arg version "v$YT_VER" \
            --argjson versionCode "$VERSION_CODE" \
            --arg zipUrl "$ZIP_URL" \
            --arg releaseType "$RELEASE_TYPE" \
            '.version = $version | .versionCode = $versionCode | .zipUrl = $zipUrl | .releaseType = $releaseType' \
            update.json > update.json.tmp && mv update.json.tmp update.json

          # Update changelog.md
          rm -f changelog.md
          echo -e "## YouTube ReVanced $YT_VER ($MORPHE_TAG) ($TODAY)\n\n${{ steps.fetch-releases.outputs.morphe_body }}\n" > changelog.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md
          git commit -m "Auto-update: YouTube $YT_VER with Morphe $MORPHE_TAG" || echo "No changes to commit"
          git push

      # ──────────────────────────────────────────────────────────
      # Step 10: Auto-Clean Old Workflow Runs
      # Automatically clean up old and obsolete GitHub Action runs
      # ──────────────────────────────────────────────────────────
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 5
